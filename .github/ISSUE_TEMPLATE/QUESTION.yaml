name: Question
description: Ask a question about building, installing, configuring, or using MTSHMEM.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, internal URLs, private IP addresses, customer data, or unsanitized logs.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include sanitized GPU, driver, MUSA, compiler, OS, and MPI details when relevant.
